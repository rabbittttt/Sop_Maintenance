name: Windows SOP acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  excel:
    runs-on: windows-latest
    env:
      SOP_SHARED_CONFIG: tests/fixtures/shared_config.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_download_contract tests.test_excel_numeric_text tests.test_source_refresh tests.test_release_smoke tests.test_offline_export.OfflineExportTest.test_full_template_is_identical_to_maintenance_visible_sheet
